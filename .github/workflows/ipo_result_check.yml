name: IPO RESULT CHECK

on:
  workflow_dispatch:

jobs:
  check-results:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Git Debug Info
        run: |
          git log -n 1 --oneline
          ls -l ipo_result.py
          grep -n "V18" ipo_result.py || echo "V18 NOT FOUND"

      - name: Cache EasyOCR Models
        uses: actions/cache@v3
        with:
          path: ~/.EasyOCR
          key: ${{ runner.os }}-easyocr-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-easyocr-

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Google Chrome (Real browser for WAF bypass)
        run: |
          wget -q -O - https://dl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
          echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" | sudo tee /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get update -q
          sudo apt-get install -y google-chrome-stable
          google-chrome --version

      - name: Install Python Dependencies
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y xvfb
          python -m pip install --upgrade pip setuptools wheel

          echo "--- INSTALLING TORCH CPU ---"
          pip install --no-cache-dir torch torchvision --index-url https://download.pytorch.org/whl/cpu

          echo "--- INSTALLING EASYOCR ---"
          pip install --no-cache-dir easyocr opencv-python-headless

          echo "--- INSTALLING PROJECT DEPS ---"
          pip install --no-cache-dir playwright playwright-stealth python-dotenv psycopg2-binary firebase-admin cryptography requests

          echo "--- INSTALLING REQUIREMENTS ---"
          pip install --no-cache-dir -r requirements.txt

          echo "--- PLAYWRIGHT: Register Chrome channel ---"
          playwright install chrome
          playwright install-deps chrome

          echo "--- VERIFICATION ---"
          python -c "import easyocr; print('SUCCESS: easyocr ready')"
          python -c "import playwright_stealth; print('SUCCESS: playwright-stealth ready:', playwright_stealth.__version__ if hasattr(playwright_stealth, '__version__') else 'unknown')"

      - name: Run IPO Result Check
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
          FIREBASE_CREDENTIALS_B64: ${{ secrets.FIREBASE_CREDENTIALS_B64 }}
          PROXY_URL: ${{ secrets.PROXY_URL }}
          RUN_MODE: "check_status"
          HEADLESS: "false"
        run: python -u ipo_result.py

      - name: Upload Debug Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshots
          path: screenshots/
          if-no-files-found: ignore
