name: IPO RESULT CHECK

on:
  workflow_dispatch:

jobs:
  check-results:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Run IPO Result Check
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
          FIREBASE_CREDENTIALS_B64: ${{ secrets.FIREBASE_CREDENTIALS_B64 }}
          PROXY_URL: ${{ secrets.PROXY_URL }}
          RUN_MODE: "check_status"
          HEADLESS: "false"
        run: python -u ipo_result.py
