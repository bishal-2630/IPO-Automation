name: Daily IPO Application Check

on:
  workflow_dispatch:      # Allow manual triggering
  schedule:
    - cron: '45 4 * * *'  # 10:30 AM NPT (04:45 AM UTC) to apply for IPOs daily

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          ref: user-part-1

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright python-dotenv psycopg2-binary firebase-admin cryptography easyocr
          playwright install chromium

      - name: Run IPO Automation Script
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
          FIREBASE_CREDENTIALS_B64: ${{ secrets.FIREBASE_CREDENTIALS_B64 }}
        run: python run_github_automation.py

      - name: Upload Debug Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: login-debug-screenshots
          path: screenshots/
          if-no-files-found: ignore
