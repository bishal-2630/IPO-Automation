name: Check IPO Results

on:
  workflow_dispatch:      # Allow manual triggering

jobs:
  check-results:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          ref: user-part-1

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Pip
        run: python -m pip install --upgrade pip

      - name: Install EasyOCR (Heavy)
        run: python -m pip install --no-cache-dir easyocr

      - name: Install Other Dependencies
        run: python -m pip install playwright python-dotenv psycopg2-binary firebase-admin cryptography

      - name: Verify Installation
        run: python -m pip list

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run IPO Result Check
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FIREBASE_CREDENTIALS_B64: ${{ secrets.FIREBASE_CREDENTIALS_B64 }}
          RUN_MODE: "check_status"
          HEADLESS: "true"
        run: python main.py
