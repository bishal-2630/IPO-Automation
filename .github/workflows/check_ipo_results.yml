# Force Refresh Commit - V2
name: Check IPO Results

on:
  workflow_dispatch:      # Allow manual triggering

jobs:
  check-results:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          ref: user-part-1

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Optimized Installation
        run: |
          python -m pip install --upgrade pip
          echo "--- Installing Heavy Deps (CPU versions) ---"
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          echo "--- Installing Project Deps ---"
          python -m pip install -r requirements.txt
          echo "--- Playwright Setup ---"
          npx playwright install --with-deps chromium
          echo "--- Verifying easyocr ---"
          python -m pip list | grep easyocr

      - name: Run IPO Result Check
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FIREBASE_CREDENTIALS_B64: ${{ secrets.FIREBASE_CREDENTIALS_B64 }}
          RUN_MODE: "check_status"
          HEADLESS: "true"
        run: python main.py
